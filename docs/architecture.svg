<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Arquitectura de Red VPC y Aprovisionamiento EC2 en AWS">
  <defs>
    <style>
      .diag-bg { fill: #111720; }
      .diag-zone { fill: rgba(148, 163, 184, 0.03); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.1; stroke-dasharray: 4 3; }
      .diag-zone-inner { fill: rgba(148, 163, 184, 0.02); stroke: rgba(148, 163, 184, 0.20); stroke-width: 1; stroke-dasharray: 3 3; }
      .diag-zone-label { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 9px; font-weight: 600; }
      .diag-box { fill: #17202c; stroke: rgba(148, 163, 184, 0.35); stroke-width: 1.3; }
      .diag-box-accent { fill: rgba(91, 164, 245, 0.12); stroke: #5ba4f5; stroke-width: 1.3; }
      .diag-box-ok { fill: rgba(52, 211, 153, 0.10); stroke: #34d399; stroke-width: 1.3; }
      .diag-label { fill: #f0f6fc; font-family: 'Fira Code', Consolas, monospace; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .diag-sub { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8.5px; text-anchor: middle; }
      .diag-edge { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8px; }
      .diag-line { fill: none; stroke: #94a3b8; stroke-width: 1.25; }
      .diag-line-dashed { fill: none; stroke: #5ba4f5; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .diag-arrow { fill: #94a3b8; }
      .diag-arrow-accent { fill: #5ba4f5; }
    </style>
    <marker id="arr-vpc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
    <marker id="arr-vpc-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow-accent" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="diag-bg" x="0" y="0" width="640" height="360" rx="8" />

  <!-- Usuario externo -->
  <rect class="diag-box" x="16" y="154" width="90" height="52" rx="6" />
  <text class="diag-label" x="61" y="177">Usuario</text>
  <text class="diag-sub" x="61" y="192">HTTP :80</text>

  <!-- Frontera AWS Cloud / VPC -->
  <rect class="diag-zone" x="126" y="16" width="498" height="328" rx="8" />
  <text class="diag-zone-label" x="138" y="33">AWS Cloud · Startup-VPC (10.0.0.0/16)</text>

  <!-- IGW y Route Table -->
  <rect class="diag-box" x="142" y="154" width="122" height="52" rx="6" />
  <text class="diag-label" x="203" y="177">Startup-IGW</text>
  <text class="diag-sub" x="203" y="192">Internet Gateway</text>

  <rect class="diag-box-ok" x="142" y="248" width="122" height="52" rx="6" />
  <text class="diag-label" x="203" y="271">Route Table</text>
  <text class="diag-sub" x="203" y="286">0.0.0.0/0 -&gt; IGW</text>

  <!-- Subzona Subred Publica -->
  <rect class="diag-zone-inner" x="288" y="46" width="320" height="282" rx="6" />
  <text class="diag-zone-label" x="298" y="61">Startup-Subnet-Publica (10.0.1.0/24)</text>

  <rect class="diag-box-ok" x="304" y="154" width="128" height="52" rx="6" />
  <text class="diag-label" x="368" y="177">Web-Server-SG</text>
  <text class="diag-sub" x="368" y="192">TCP 80 · SSH 22</text>

  <rect class="diag-box-accent" x="460" y="72" width="134" height="48" rx="6" />
  <text class="diag-label" x="527" y="93">User Data Bash</text>
  <text class="diag-sub" x="527" y="108">dnf + httpd boot</text>

  <rect class="diag-box-accent" x="460" y="154" width="134" height="52" rx="6" />
  <text class="diag-label" x="527" y="177">EC2 (t2/t3.micro)</text>
  <text class="diag-sub" x="527" y="192">AL2023 · Apache</text>

  <rect class="diag-box" x="460" y="248" width="134" height="48" rx="6" />
  <text class="diag-label" x="527" y="269">IPv4 Pública</text>
  <text class="diag-sub" x="527" y="284">Auto-assign</text>

  <!-- Flechas trafico principal -->
  <line class="diag-line" x1="106" y1="180" x2="138" y2="180" marker-end="url(#arr-vpc)" />
  <line class="diag-line" x1="264" y1="180" x2="300" y2="180" marker-end="url(#arr-vpc)" />
  <line class="diag-line" x1="432" y1="180" x2="456" y2="180" marker-end="url(#arr-vpc)" />

  <!-- Flechas control / bootstrapping -->
  <line class="diag-line-dashed" x1="203" y1="248" x2="203" y2="210" marker-end="url(#arr-vpc-acc)" />
  <text class="diag-edge" x="210" y="233">Ruta</text>

  <line class="diag-line-dashed" x1="527" y1="120" x2="527" y2="150" marker-end="url(#arr-vpc-acc)" />
  <text class="diag-edge" x="534" y="139">Bootstrap</text>

  <line class="diag-line-dashed" x1="527" y1="248" x2="527" y2="210" marker-end="url(#arr-vpc-acc)" />
  <text class="diag-edge" x="534" y="233">IP pública</text>
</svg>
